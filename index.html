<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Schema Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Monochromatic Theme Configuration */
        :root {
            --bg-canvas: #121212;
            --bg-surface: #1e1e1e;
            --bg-surface-hover: #2a2a2a;
            --border-color: #333333;
            --border-focus: #555555;
            --text-main: #e0e0e0;
            --text-muted: #888888;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-main);
            overflow: hidden; /* Prevent native scrolling, we handle canvas pan */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none; /* Prevent text selection while dragging */
        }

        /* Dot Grid Background applied dynamically to follow panning */
        #canvas-wrapper {
            width: 100vw;
            height: 100vh;
            cursor: grab;
            position: relative;
        }

        #canvas-wrapper:active {
            cursor: grabbing;
        }

        /* The container that actually scales and moves */
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 0; 
            height: 0;
            overflow: visible;
            transform-origin: 0 0;
        }

        /* Table Card Styling */
        .table-card {
            position: absolute;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 280px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            cursor: default;
        }

        .table-header {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            background-color: #1a1a1a;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .table-header:active {
            cursor: grabbing;
        }

        /* Inputs */
        input, select {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-main);
            border-radius: 4px;
            outline: none;
            transition: all 0.2s;
            user-select: text; /* Allow text selection inside inputs */
        }

        input:hover, select:hover {
            border-color: var(--border-color);
            background: rgba(255,255,255,0.02);
        }

        input:focus, select:focus {
            border-color: var(--border-focus);
            background: rgba(255,255,255,0.05);
        }

        .field-row {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
            gap: 8px;
            background-color: var(--bg-surface);
            transition: background-color 0.2s;
            position: relative;
        }

        .field-row:hover {
            background-color: var(--bg-surface-hover);
        }
        
        .field-row:last-child {
            border-bottom: none;
        }

        /* SVG Links Layer */
        #svg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            overflow: visible;
            pointer-events: none; /* Let clicks pass through to canvas */
            z-index: 0;
        }

        path.link-line {
            fill: none;
            stroke: #a3a3a3;
            stroke-width: 2;
            pointer-events: auto; /* Allow clicking the line to delete */
            cursor: pointer;
            transition: stroke 0.2s, stroke-width 0.2s;
        }

        path.link-line:hover {
            stroke: #fff;
            stroke-width: 3;
        }

        .link-port {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--bg-surface-hover);
            border: 2px solid var(--border-color);
            cursor: crosshair;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        
        .link-port:hover, .link-port.active {
            background-color: var(--text-main);
            border-color: #fff;
            transform: scale(1.2);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-canvas);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-focus);
        }

        /* Valid linking target highlight */
        .valid-target {
            box-shadow: inset 0 0 0 2px var(--text-main);
            background-color: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body class="text-sm">

    <!-- Fixed Top Bar -->
    <div class="fixed top-0 left-0 right-0 p-4 flex justify-between items-center z-50 pointer-events-none">
        <div>
            <h1 class="text-xl font-bold tracking-tight text-gray-200 pointer-events-auto">Schema Builder</h1>
        </div>
        <div class="flex gap-3 pointer-events-auto">
            <button onclick="addTable()" class="px-4 py-2 rounded bg-neutral-800 border border-neutral-700 text-gray-300 hover:bg-neutral-700 hover:text-white transition-colors flex items-center gap-2 shadow-lg">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                Add Table
            </button>
            <button onclick="openExportModal()" class="px-4 py-2 rounded bg-neutral-200 text-neutral-900 font-medium hover:bg-white transition-colors flex items-center gap-2 shadow-lg">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                Export SQL
            </button>
            <button onclick="clearAll()" class="px-3 py-2 rounded bg-neutral-800 border border-neutral-700 text-red-400 hover:bg-red-900/30 hover:border-red-800 transition-colors shadow-lg" title="Clear Canvas">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>
        </div>
    </div>

    <!-- Zoom Controls -->
    <div class="fixed bottom-6 right-6 flex flex-col z-50 bg-neutral-800 border border-neutral-700 rounded shadow-xl overflow-hidden">
        <button onclick="zoom(0.1)" class="w-10 h-10 flex items-center justify-center text-gray-400 hover:text-white hover:bg-neutral-700 border-b border-neutral-700 transition-colors">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
        </button>
        <button onclick="resetZoom()" class="w-10 h-10 flex items-center justify-center text-xs font-mono text-gray-400 hover:text-white hover:bg-neutral-700 border-b border-neutral-700 transition-colors" id="zoom-label">
            100%
        </button>
        <button onclick="zoom(-0.1)" class="w-10 h-10 flex items-center justify-center text-gray-400 hover:text-white hover:bg-neutral-700 transition-colors">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4"></path></svg>
        </button>
    </div>

    <!-- Interactive Canvas Layer -->
    <div id="canvas-wrapper">
        <div id="canvas">
            <!-- SVG for drawing relationship lines -->
            <svg id="svg-layer">
                <defs>
                    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#a3a3a3" />
                    </marker>
                    <marker id="arrowhead-hover" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#fff" />
                    </marker>
                </defs>
                <g id="links-group"></g>
                <path id="temp-link" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)" style="display: none;"></path>
            </svg>
            <!-- Tables will be injected here -->
            <div id="tables-container"></div>
        </div>
    </div>

    <!-- Export Modal -->
    <div id="export-modal" class="fixed inset-0 bg-black/80 z-[100] hidden flex items-center justify-center backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div class="bg-neutral-900 border border-neutral-700 rounded-lg shadow-2xl w-full max-w-3xl flex flex-col max-h-[80vh] transform scale-95 transition-transform duration-300" id="export-modal-content">
            <div class="p-4 border-b border-neutral-800 flex justify-between items-center bg-neutral-800/50 rounded-t-lg">
                <h2 class="text-lg font-bold text-gray-200">Export SQL Schema</h2>
                <button onclick="closeExportModal()" class="text-gray-500 hover:text-white transition-colors">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-6 flex-1 overflow-auto relative group">
                <button onclick="copySQL()" class="absolute top-8 right-8 bg-neutral-700 text-white px-3 py-1.5 rounded text-xs opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-1 shadow-md hover:bg-neutral-600">
                    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    Copy Code
                </button>
                <pre><code id="sql-output" class="text-sm font-mono text-gray-300 whitespace-pre-wrap"></code></pre>
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        const DATA_TYPES = [
            { id: 'text', label: 'Short Text', sql: 'VARCHAR(255)' },
            { id: 'longtext', label: 'Paragraph / Long Text', sql: 'TEXT' },
            { id: 'email', label: 'Email Address', sql: 'VARCHAR(255)' },
            { id: 'phone', label: 'Phone Number', sql: 'VARCHAR(50)' },
            { id: 'number', label: 'Whole Number', sql: 'INT' },
            { id: 'decimal', label: 'Decimal (Money)', sql: 'DECIMAL(10,2)' },
            { id: 'date', label: 'Date', sql: 'DATE' },
            { id: 'boolean', label: 'Yes / No', sql: 'BOOLEAN' }
        ];

        let state = {
            tables: [],
            links: [],
            idCounter: 1
        };

        // Canvas Transformation state
        let transform = { x: 0, y: 0, scale: 1 };
        
        // Interaction state
        let isPanning = false;
        let panStart = { x: 0, y: 0 };
        
        let draggedTable = null;
        let dragOffset = { x: 0, y: 0 };
        
        let linkingState = null; // { tableId, fieldId, isPrimary }

        // --- DOM Elements ---
        const wrapper = document.getElementById('canvas-wrapper');
        const canvas = document.getElementById('canvas');
        const tablesContainer = document.getElementById('tables-container');
        const linksGroup = document.getElementById('links-group');
        const tempLinkPath = document.getElementById('temp-link');
        const zoomLabel = document.getElementById('zoom-label');

        // --- Initialization ---
        function init() {
            loadState();
            applyTransform();
            renderTables();
            updateGridBackground();
            
            // If empty, create a default table to start
            if (state.tables.length === 0) {
                addTable(true);
            }
        }

        // --- Storage ---
        function saveState() {
            localStorage.setItem('easySchemaState', JSON.stringify(state));
        }

        function loadState() {
            const saved = localStorage.getItem('easySchemaState');
            if (saved) {
                try {
                    state = JSON.parse(saved);
                } catch(e) { console.error("Error loading state"); }
            }
        }

        function clearAll() {
            state = { tables: [], links: [], idCounter: 1 };
            saveState();
            renderTables();
            renderLinks();
            addTable(true); // Add a blank one to start over
        }

        // --- Core Functions ---
        function generateId() {
            return 'id_' + (state.idCounter++);
        }

        function addTable(centerOnScreen = false) {
            let x = 100;
            let y = 100;
            
            if (centerOnScreen) {
                // Calculate center taking pan/zoom into account
                const rect = wrapper.getBoundingClientRect();
                x = (rect.width / 2 - transform.x) / transform.scale - 140; // 140 is half table width
                y = (rect.height / 2 - transform.y) / transform.scale - 100;
            } else if (state.tables.length > 0) {
                // Stagger slightly from last table
                const last = state.tables[state.tables.length - 1];
                x = last.x + 40;
                y = last.y + 40;
            }

            const newTable = {
                id: generateId(),
                name: 'New_Table',
                x: x,
                y: y,
                fields: [
                    { id: generateId(), name: 'id', type: 'number', isPrimary: true }
                ]
            };
            
            state.tables.push(newTable);
            saveState();
            renderTables();
            renderLinks(); // Refresh links in case Z-indexes changed
        }

        function addField(tableId) {
            const table = state.tables.find(t => t.id === tableId);
            if (table) {
                table.fields.push({
                    id: generateId(),
                    name: 'new_field',
                    type: 'text',
                    isPrimary: false
                });
                saveState();
                renderTables();
                renderLinks();
            }
        }

        function deleteTable(tableId) {
            state.tables = state.tables.filter(t => t.id !== tableId);
            // Remove associated links
            state.links = state.links.filter(l => l.sourceTable !== tableId && l.targetTable !== tableId);
            saveState();
            renderTables();
            renderLinks();
        }

        function deleteField(tableId, fieldId) {
            const table = state.tables.find(t => t.id === tableId);
            if (table) {
                table.fields = table.fields.filter(f => f.id !== fieldId);
                // Remove associated links
                state.links = state.links.filter(l => l.sourceField !== fieldId && l.targetField !== fieldId);
                saveState();
                renderTables();
                renderLinks();
            }
        }

        function deleteLink(index) {
            state.links.splice(index, 1);
            saveState();
            renderLinks();
        }

        function renderTables() {
            tablesContainer.innerHTML = '';
            
            state.tables.forEach(table => {
                const tableEl = document.createElement('div');
                tableEl.className = 'table-card';
                tableEl.id = `table-${table.id}`;
                tableEl.style.left = `${table.x}px`;
                tableEl.style.top = `${table.y}px`;

                // Header
                const header = document.createElement('div');
                header.className = 'table-header';
                
                const titleInput = document.createElement('input');
                titleInput.type = 'text';
                titleInput.value = table.name;
                titleInput.className = 'font-bold text-gray-200 bg-transparent w-full mr-2';
                titleInput.onchange = (e) => {
                    table.name = e.target.value.replace(/\s+/g, '_'); // Enforce SQL friendly name
                    e.target.value = table.name;
                    saveState();
                };

                const delBtn = document.createElement('button');
                delBtn.innerHTML = '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>';
                delBtn.className = 'text-gray-500 hover:text-red-400 transition-colors';
                delBtn.onclick = () => deleteTable(table.id);

                header.appendChild(titleInput);
                header.appendChild(delBtn);

                // Fields Container
                const fieldsContainer = document.createElement('div');
                fieldsContainer.className = 'flex flex-col pb-2';

                table.fields.forEach(field => {
                    const row = document.createElement('div');
                    row.className = 'field-row group';
                    row.id = `row-${table.id}-${field.id}`;
                    if (linkingState && linkingState.tableId !== table.id) {
                         row.classList.add('hover:valid-target');
                         row.style.cursor = 'pointer';
                         row.onclick = () => completeLink(table.id, field.id);
                    }

                    // Link Port / Key Icon
                    const portContainer = document.createElement('div');
                    portContainer.className = 'w-6 flex justify-center items-center';
                    portContainer.id = `port-container-${table.id}-${field.id}`;
                    
                    if (field.isPrimary) {
                        portContainer.innerHTML = '<svg width="14" height="14" class="text-yellow-500" fill="currentColor" viewBox="0 0 256 256"><path d="M168,80a48,48,0,1,0-48,48v88a8,8,0,0,0,8,8h24v24a8,8,0,0,0,8,8h24a8,8,0,0,0,8-8V192a8,8,0,0,0-8-8H168V125.1A48.2,48.2,0,0,0,168,80Zm-48-16a16,16,0,1,1,16,16A16,16,0,0,1,120,64Z"></path></svg>';
                    } else {
                        const port = document.createElement('div');
                        port.className = 'link-port opacity-0 group-hover:opacity-100';
                        port.id = `port-${table.id}-${field.id}`;
                        // Keep visible if actively linking from here or linked to here
                        if (isFieldLinked(table.id, field.id) || (linkingState && linkingState.fieldId === field.id)) {
                             port.classList.remove('opacity-0', 'group-hover:opacity-100');
                             port.classList.add('active');
                        }
                        
                        // Prevent click from propagating to row when linking
                        port.onclick = (e) => {
                            e.stopPropagation();
                            if (linkingState) {
                                if (linkingState.tableId !== table.id) {
                                    completeLink(table.id, field.id);
                                } else {
                                    cancelLink();
                                }
                            } else {
                                startLink(table.id, field.id, port);
                            }
                        };
                        portContainer.appendChild(port);
                    }

                    // Field Name Input
                    const nameInput = document.createElement('input');
                    nameInput.type = 'text';
                    nameInput.value = field.name;
                    nameInput.className = 'flex-1 min-w-0 text-sm font-medium';
                    nameInput.readOnly = linkingState !== null; // disable edit while linking
                    nameInput.onchange = (e) => {
                        field.name = e.target.value.replace(/\s+/g, '_');
                        e.target.value = field.name;
                        saveState();
                    };

                    // Type Select
                    const typeSelect = document.createElement('select');
                    typeSelect.className = 'w-24 text-xs bg-neutral-800 text-gray-400 p-1 rounded';
                    typeSelect.disabled = linkingState !== null || field.isPrimary;
                    
                    DATA_TYPES.forEach(dt => {
                        const opt = document.createElement('option');
                        opt.value = dt.id;
                        opt.textContent = dt.label;
                        if (field.type === dt.id) opt.selected = true;
                        typeSelect.appendChild(opt);
                    });
                    
                    typeSelect.onchange = (e) => {
                        field.type = e.target.value;
                        saveState();
                    };

                    // Delete Field Button (hide if primary)
                    const fDelBtn = document.createElement('button');
                    if (!field.isPrimary) {
                        fDelBtn.innerHTML = '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>';
                        fDelBtn.className = 'text-gray-600 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity ml-1';
                        fDelBtn.onclick = (e) => {
                            e.stopPropagation();
                            deleteField(table.id, field.id);
                        };
                    } else {
                        fDelBtn.className = 'w-4 ml-1'; // placeholder space
                    }

                    row.appendChild(portContainer);
                    row.appendChild(nameInput);
                    row.appendChild(typeSelect);
                    row.appendChild(fDelBtn);
                    
                    fieldsContainer.appendChild(row);
                });

                // Add Field Button
                const addFieldBtn = document.createElement('button');
                addFieldBtn.className = 'mx-3 mb-3 mt-1 py-1.5 px-3 text-xs flex items-center justify-center gap-1 bg-neutral-800/50 hover:bg-neutral-800 border border-dashed border-neutral-600 hover:border-neutral-500 rounded text-gray-400 hover:text-white transition-colors';
                addFieldBtn.innerHTML = '<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg> Add Field';
                addFieldBtn.onclick = () => addField(table.id);

                tableEl.appendChild(header);
                tableEl.appendChild(fieldsContainer);
                tableEl.appendChild(addFieldBtn);

                // Drag logic on header
                header.addEventListener('mousedown', (e) => {
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
                    draggedTable = table;
                    // Calculate offset taking zoom into account
                    dragOffset.x = (e.clientX - (table.x * transform.scale + transform.x)) / transform.scale;
                    dragOffset.y = (e.clientY - (table.y * transform.scale + transform.y)) / transform.scale;
                    tableEl.style.zIndex = 10;
                });

                tablesContainer.appendChild(tableEl);
            });
            
            // Ensure links are drawn correctly after layout is done
            setTimeout(renderLinks, 0); 
        }

        function isFieldLinked(tableId, fieldId) {
            return state.links.some(l => 
                (l.sourceTable === tableId && l.sourceField === fieldId) ||
                (l.targetTable === tableId && l.targetField === fieldId)
            );
        }

        function startLink(tableId, fieldId, portElement) {
            if (linkingState) {
                cancelLink(); // cancel existing if clicking another port
                return;
            }
            linkingState = { tableId, fieldId };
            tempLinkPath.style.display = 'block';
            wrapper.style.cursor = 'crosshair';
            renderTables(); // Re-render to show valid targets
        }

        function completeLink(targetTableId, targetFieldId) {
            if (!linkingState) return;
            
            // Prevent linking to self
            if (linkingState.tableId === targetTableId) {
                cancelLink();
                return;
            }

            state.links.push({
                sourceTable: linkingState.tableId,
                sourceField: linkingState.fieldId,
                targetTable: targetTableId,
                targetField: targetFieldId
            });
            
            saveState();
            cancelLink(); // resets state and re-renders
        }

        function cancelLink() {
            linkingState = null;
            tempLinkPath.style.display = 'none';
            wrapper.style.cursor = 'grab';
            renderTables();
        }

        function renderLinks() {
            linksGroup.innerHTML = '';
            
            state.links.forEach((link, index) => {
                const sRow = document.getElementById(`row-${link.sourceTable}-${link.sourceField}`);
                const tRow = document.getElementById(`row-${link.targetTable}-${link.targetField}`);
                
                // If elements are missing (e.g. collapsed/deleted but state not clean), skip
                if (!sRow || !tRow) return;
                
                const sRect = sRow.getBoundingClientRect();
                const tRect = tRow.getBoundingClientRect();
                const canvasRect = canvas.getBoundingClientRect();
                
                // Get local canvas coordinates for left and right edges
                const sRight = (sRect.right - canvasRect.left) / transform.scale;
                const sLeft = (sRect.left - canvasRect.left) / transform.scale;
                const sY = (sRect.top + sRect.height/2 - canvasRect.top) / transform.scale;
                
                const tRight = (tRect.right - canvasRect.left) / transform.scale;
                const tLeft = (tRect.left - canvasRect.left) / transform.scale;
                const tY = (tRect.top + tRect.height/2 - canvasRect.top) / transform.scale;
                
                let sx, sy = sY, tx, ty = tY, cx1, cx2;
                
                // Smart routing based on relative horizontal positions
                if (sRect.right + 40 < tRect.left) {
                    // Source is to the left of Target -> Exit Right, Enter Left
                    sx = sRight; tx = tLeft;
                    cx1 = sx + 80; cx2 = tx - 80;
                } else if (sRect.left > tRect.right + 40) {
                    // Source is to the right of Target -> Exit Left, Enter Right
                    sx = sLeft; tx = tRight;
                    cx1 = sx - 80; cx2 = tx + 80;
                } else {
                    // Stacked or overlapping -> Loop around the right side
                    sx = sRight; tx = tRight;
                    const loopOffset = Math.max(60, Math.abs(ty - sy) * 0.6);
                    cx1 = sx + loopOffset; cx2 = tx + loopOffset;
                }
                
                // Create SVG path
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute('class', 'link-line');
                path.setAttribute('marker-end', 'url(#arrowhead)');
                
                const d = `M ${sx} ${sy} C ${cx1} ${sy}, ${cx2} ${ty}, ${tx} ${ty}`;
                path.setAttribute('d', d);
                
                // Hover effects to highlight arrow along with line
                path.onmouseenter = () => path.setAttribute('marker-end', 'url(#arrowhead-hover)');
                path.onmouseleave = () => path.setAttribute('marker-end', 'url(#arrowhead)');
                
                // Click to delete
                path.onclick = () => deleteLink(index);
                
                linksGroup.appendChild(path);
            });
        }

        window.addEventListener('mousemove', (e) => {
            // 1. Handle Table Dragging
            if (draggedTable) {
                const x = (e.clientX - transform.x) / transform.scale - dragOffset.x;
                const y = (e.clientY - transform.y) / transform.scale - dragOffset.y;
                
                draggedTable.x = x;
                draggedTable.y = y;
                
                const el = document.getElementById(`table-${draggedTable.id}`);
                if (el) {
                    el.style.left = `${x}px`;
                    el.style.top = `${y}px`;
                }
                
                // Fast update links without full render
                renderLinks(); 
                return;
            }

            // 2. Handle Canvas Panning
            if (isPanning) {
                transform.x = e.clientX - panStart.x;
                transform.y = e.clientY - panStart.y;
                applyTransform();
                return;
            }

            // 3. Handle Active Linking Line
            if (linkingState) {
                const sRow = document.getElementById(`row-${linkingState.tableId}-${linkingState.fieldId}`);
                if (!sRow) return;
                
                const sRect = sRow.getBoundingClientRect();
                const canvasRect = canvas.getBoundingClientRect();
                
                const sRight = (sRect.right - canvasRect.left) / transform.scale;
                const sLeft = (sRect.left - canvasRect.left) / transform.scale;
                const sY = (sRect.top + sRect.height/2 - canvasRect.top) / transform.scale;
                
                const mx = (e.clientX - canvasRect.left) / transform.scale;
                const my = (e.clientY - canvasRect.top) / transform.scale;
                
                let sx, sy = sY, cx1, cx2;
                
                // Route smartly based on mouse position relative to source row
                if (mx > sRight) {
                    sx = sRight;
                    cx1 = sx + 80;
                    cx2 = mx - 80;
                } else if (mx < sLeft) {
                    sx = sLeft;
                    cx1 = sx - 80;
                    cx2 = mx + 80;
                } else {
                    sx = sRight; // default to exiting right if positioned vertically
                    cx1 = sx + 80;
                    cx2 = mx + 80;
                }
                
                tempLinkPath.setAttribute('d', `M ${sx} ${sy} C ${cx1} ${sy}, ${cx2} ${my}, ${mx} ${my}`);
            }
        });

        window.addEventListener('mouseup', () => {
            if (draggedTable) {
                const el = document.getElementById(`table-${draggedTable.id}`);
                if (el) el.style.zIndex = '';
                draggedTable = null;
                saveState();
            }
            isPanning = false;
        });

        // Initialize Pan
        wrapper.addEventListener('mousedown', (e) => {
            // Only pan if clicking exactly on wrapper or SVG background, not tables
            if (e.target === wrapper || e.target === canvas || e.target.id === 'svg-layer') {
                if (linkingState) {
                    cancelLink(); // click background to cancel link
                    return;
                }
                isPanning = true;
                panStart = {
                    x: e.clientX - transform.x,
                    y: e.clientY - transform.y
                };
            }
        });

        // Initialize Zoom via Mouse Wheel
        wrapper.addEventListener('wheel', (e) => {
            // Prevent default zoom if ctrl is pressed
            if (e.ctrlKey) e.preventDefault(); 
            
            const zoomSpeed = 0.001;
            const delta = -e.deltaY * zoomSpeed;
            
            let newScale = transform.scale * (1 + delta);
            newScale = Math.max(0.2, Math.min(newScale, 3)); // Clamp 0.2x to 3.0x
            
            // Zoom towards mouse cursor
            const rect = wrapper.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            transform.x = mouseX - (mouseX - transform.x) * (newScale / transform.scale);
            transform.y = mouseY - (mouseY - transform.y) * (newScale / transform.scale);
            transform.scale = newScale;
            
            applyTransform();
        }, { passive: false });

        function applyTransform() {
            canvas.style.transform = `translate(${transform.x}px, ${transform.y}px) scale(${transform.scale})`;
            zoomLabel.innerText = `${Math.round(transform.scale * 100)}%`;
            updateGridBackground();
        }

        function updateGridBackground() {
            // Visual dot grid that pans and zooms
            const bgSize = 24 * transform.scale;
            wrapper.style.backgroundImage = `radial-gradient(circle, var(--border-color) 1px, transparent 1px)`;
            wrapper.style.backgroundSize = `${bgSize}px ${bgSize}px`;
            wrapper.style.backgroundPosition = `${transform.x}px ${transform.y}px`;
        }

        function zoom(delta) {
            let newScale = transform.scale + delta;
            newScale = Math.max(0.2, Math.min(newScale, 3));
            
            // Zoom to center for UI buttons
            const rect = wrapper.getBoundingClientRect();
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            transform.x = centerX - (centerX - transform.x) * (newScale / transform.scale);
            transform.y = centerY - (centerY - transform.y) * (newScale / transform.scale);
            transform.scale = newScale;
            
            applyTransform();
        }

        function resetZoom() {
            transform = { x: 0, y: 0, scale: 1 };
            applyTransform();
        }

        function getSqlType(typeId) {
            const typeDef = DATA_TYPES.find(d => d.id === typeId);
            return typeDef ? typeDef.sql : 'VARCHAR(255)';
        }

        function generateSQL() {
            let sql = `-- Generated by Easy Schema Builder\n\n`;

            // 1. Generate Tables
            state.tables.forEach(table => {
                sql += `CREATE TABLE \`${table.name}\` (\n`;
                
                const fieldDefs = [];
                let primaryKey = null;

                table.fields.forEach(field => {
                    let def = `  \`${field.name}\` ${getSqlType(field.type)}`;
                    if (field.isPrimary) {
                        def += ` NOT NULL AUTO_INCREMENT`;
                        primaryKey = field.name;
                    }
                    fieldDefs.push(def);
                });

                if (primaryKey) {
                    fieldDefs.push(`  PRIMARY KEY (\`${primaryKey}\`)`);
                }

                sql += fieldDefs.join(',\n');
                sql += `\n);\n\n`;
            });

            // 2. Generate Foreign Keys from visual links
            if (state.links.length > 0) {
                sql += `-- Relationships\n`;
                state.links.forEach(link => {
                    const sTable = state.tables.find(t => t.id === link.sourceTable);
                    const sField = sTable?.fields.find(f => f.id === link.sourceField);
                    const tTable = state.tables.find(t => t.id === link.targetTable);
                    const tField = tTable?.fields.find(f => f.id === link.targetField);

                    if (sTable && sField && tTable && tField) {
                        // Assuming target is the foreign key column in the target table referencing the source table
                        sql += `ALTER TABLE \`${tTable.name}\` ADD CONSTRAINT \`fk_${tTable.name}_${sTable.name}\` FOREIGN KEY (\`${tField.name}\`) REFERENCES \`${sTable.name}\`(\`${sField.name}\`);\n`;
                    }
                });
            }

            return sql;
        }

        function openExportModal() {
            const sql = generateSQL();
            document.getElementById('sql-output').innerText = sql;
            
            const modal = document.getElementById('export-modal');
            const content = document.getElementById('export-modal-content');
            
            modal.classList.remove('hidden');
            // Small delay to allow display:block to apply before animation
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            }, 10);
        }

        function closeExportModal() {
            const modal = document.getElementById('export-modal');
            const content = document.getElementById('export-modal-content');
            
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300); // match duration
        }

        function copySQL() {
            const code = document.getElementById('sql-output').innerText;
            navigator.clipboard.writeText(code).then(() => {
                const btn = document.querySelector('button[onclick="copySQL()"]');
                const originalText = btn.innerHTML;
                btn.innerHTML = `<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg> Copied!`;
                btn.classList.add('bg-green-600');
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.remove('bg-green-600');
                }, 2000);
            });
        }

        // Close modal on click outside
        document.getElementById('export-modal').addEventListener('mousedown', (e) => {
            if (e.target.id === 'export-modal') closeExportModal();
        });
        
        // Handle window resize to fix SVG scaling logic
        window.addEventListener('resize', () => {
             renderLinks();
             applyTransform(); // update background size
        });

        // Run application
        init();
    </script>
</body>
</html>
